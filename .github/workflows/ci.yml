name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - name: Type check
        run: npm run check:types

      - name: Lint
        run: npm run check:biome

      - name: Test
        run: npm test

      - name: Verify docs are up to date
        run: |
          npm run docs
          git diff --exit-code docs/keyboard.html || {
            echo "docs/keyboard.html is out of sync with the config"
            echo "Run 'npm run docs' and commit the result"
            exit 1
          }
